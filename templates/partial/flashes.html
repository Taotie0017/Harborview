{% with messages = get_flashed_messages(with_categories=true) %}
  {% if messages %}
    <ul class="flashes">
      {% for category, message in messages %}
        <li class="flash flash-{{ category }}" role="status">
          <span>{{ message }}</span>
          <button class="flash-close" type="button" aria-label="Dismiss notification">×</button>
        </li>
      {% endfor %}
    </ul>
  {% endif %}
{% endwith %}

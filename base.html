{% extends "layout.html" %}

{% block header %}
  <header class="site-header">
    <a class="brand" href="{{ url_for('public.welcome') }}">
      <img src="{{ url_for('static', filename='images/mark.svg') }}" alt="" width="42" height="42">
      <span>
        <strong>Harborview</strong>
        <small>Student Events</small>
      </span>
    </a>
    <button class="nav-toggle" type="button" aria-expanded="false" aria-controls="site-nav">Menu</button>
    <nav id="site-nav" class="site-nav">
      <a href="{{ url_for('public.welcome') }}">Home</a>
      {% if current_role == "student" %}
        <a href="{{ url_for('student.dashboard') }}">Dashboard</a>
        <a href="{{ url_for('student.records') }}">My Logins</a>
        <span class="nav-user">{{ current_name }}</span>
        <form class="inline-form" method="post" action="{{ url_for('public.logout') }}">
          <input type="hidden" name="csrf_token" value="{{ csrf_token() }}">
          <button class="ghost" type="submit">Log out</button>
        </form>
      {% else %}
        <a href="{{ url_for('public.login') }}">Login</a>
        <a class="button button-small" href="{{ url_for('public.signup') }}">Sign Up</a>
        <a class="nav-admin" href="{{ url_for('admin.login') }}">Admin Login</a>
      {% endif %}
    </nav>
  </header>
{% endblock %}
